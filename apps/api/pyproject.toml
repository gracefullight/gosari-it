[project]
name = "gosari-api"
version = "0.1.0"
description = "고사리잇 Litestar backend — 제주 고사리 채취 동행 AI 에이전트"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litestar[standard]>=2.25.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.4.0",
    "alembic>=1.20.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "pandas>=2.3.0",
    "structlog>=26.1.0",
    "sentence-transformers>=5.1.0",
    # Linux 컨테이너는 CPU 전용 휠 고정 (CUDA 의존성으로 이미지 비대화 방지)
    "torch==2.15.0+cpu; sys_platform == 'linux'",
    "torch>=2.15.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "poethepoet>=0.48.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gosari"]

[tool.uv]
managed = true

# Linux 컨테이너에서는 CPU 전용 torch 휠을 사용해 이미지 크기를 제한한다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.poe.tasks]
dev = "uvicorn gosari.app:create_app --factory --reload --port 8000"
start = "uvicorn gosari.app:create_app --factory --host 0.0.0.0 --port 8765"

# Database
migrate = "alembic upgrade head"
"migrate-create" = "alembic revision --autogenerate -m"
"migrate-down" = "alembic downgrade -1"

# Linting & Formatting
lint = "ruff check --fix --unsafe-fixes ."
format = "ruff format ."
check = ["lint", "format"]

# Type checking
typecheck = "pyrefly check"

# All checks
"all-checks" = ["check", "typecheck"]

# Testing
test = "pytest tests/ -q"
"test:cov" = "pytest tests/ --cov=gosari --cov-report=html"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src"]
search-path = ["."]
preset = "strict"
check-unannotated-defs = true
ignore-missing-imports = [
    "psycopg.*",
    "pgvector.*",
    "sentence_transformers.*",
    "pandas.*",
]

[tool.pyrefly.errors]
no-any-return = "error"
unannotated-return = "error"