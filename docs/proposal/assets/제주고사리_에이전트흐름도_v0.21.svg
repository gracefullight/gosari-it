<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="공개 분석과 개인 작업을 분리한 에이전트 처리 흐름"><title>공개 분석과 개인 작업을 분리한 에이전트 처리 흐름</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker></defs><rect width="1100" height="580" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif"><text x="25" y="42" fill="#111111" font-size="28" font-weight="600"><tspan x="25" dy="0">공개 분석: 나들이·지역 탐색·가격</tspan></text><rect x="20" y="70" width="180" height="95" rx="0" fill="#f4f4f4" stroke="#999999"/><text x="40" y="108" fill="#111111" font-size="28" font-weight="600"><tspan x="40" dy="0">지역·조건</tspan></text><text x="40" y="145" fill="#444444" font-size="24" font-weight="400"><tspan x="40" dy="0">로컬 확인</tspan></text><rect x="240" y="70" width="180" height="95" rx="0" fill="#f4f4f4" stroke="#999999"/><text x="260" y="108" fill="#111111" font-size="28" font-weight="600"><tspan x="260" dy="0">응답 캐시</tspan></text><text x="260" y="145" fill="#444444" font-size="24" font-weight="400"><tspan x="260" dy="0">유사도 비교</tspan></text><rect x="460" y="70" width="180" height="95" rx="0" fill="#f4f4f4" stroke="#999999"/><text x="480" y="108" fill="#111111" font-size="28" font-weight="600"><tspan x="480" dy="0">자료 취득</tspan></text><text x="480" y="145" fill="#444444" font-size="24" font-weight="400"><tspan x="480" dy="0">미스 시 조회</tspan></text><rect x="680" y="70" width="180" height="95" rx="0" fill="#f4f4f4" stroke="#999999"/><text x="700" y="108" fill="#111111" font-size="28" font-weight="600"><tspan x="700" dy="0">계산·근거</tspan></text><text x="700" y="145" fill="#444444" font-size="24" font-weight="400"><tspan x="700" dy="0">시점·품질</tspan></text><rect x="900" y="70" width="180" height="95" rx="0" fill="#f4f4f4" stroke="#999999"/><text x="920" y="108" fill="#111111" font-size="28" font-weight="600"><tspan x="920" dy="0">지도·결과</tspan></text><text x="920" y="145" fill="#444444" font-size="24" font-weight="400"><tspan x="920" dy="0">상태·출처</tspan></text><path d="M 200 117 L 240 117" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 420 117 L 460 117" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 640 117 L 680 117" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 860 117 L 900 117" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><text x="25" y="218" fill="#444444" font-size="24" font-weight="400"><tspan x="25" dy="0">출처·시점·비교 범위를 함께 제시해 사용자가 결과를 이해하도록 돕는다.</tspan></text><text x="25" y="300" fill="#111111" font-size="28" font-weight="600"><tspan x="25" dy="0">개인 작업: 수첩·나눔·장소 저장</tspan></text><rect x="20" y="330" width="180" height="95" rx="0" fill="#f5f5f5" stroke="#999999"/><text x="40" y="368" fill="#111111" font-size="28" font-weight="600"><tspan x="40" dy="0">입력·초안</tspan></text><text x="40" y="405" fill="#444444" font-size="24" font-weight="400"><tspan x="40" dy="0">브라우저 초안</tspan></text><rect x="240" y="330" width="180" height="95" rx="0" fill="#f5f5f5" stroke="#999999"/><text x="260" y="368" fill="#111111" font-size="28" font-weight="600"><tspan x="260" dy="0">미리보기</tspan></text><text x="260" y="405" fill="#444444" font-size="24" font-weight="400"><tspan x="260" dy="0">대상·내용</tspan></text><rect x="460" y="330" width="180" height="95" rx="0" fill="#f5f5f5" stroke="#999999"/><text x="480" y="368" fill="#111111" font-size="28" font-weight="600"><tspan x="480" dy="0">사용자 확정</tspan></text><text x="480" y="405" fill="#444444" font-size="24" font-weight="400"><tspan x="480" dy="0">작업 승인</tspan></text><rect x="680" y="330" width="180" height="95" rx="0" fill="#f5f5f5" stroke="#999999"/><text x="700" y="368" fill="#111111" font-size="28" font-weight="600"><tspan x="700" dy="0">동의 검사</tspan></text><text x="700" y="405" fill="#444444" font-size="24" font-weight="400"><tspan x="700" dy="0">세션·해시</tspan></text><rect x="900" y="330" width="180" height="95" rx="0" fill="#f5f5f5" stroke="#999999"/><text x="920" y="368" fill="#111111" font-size="28" font-weight="600"><tspan x="920" dy="0">변경·결과</tspan></text><text x="920" y="405" fill="#444444" font-size="24" font-weight="400"><tspan x="920" dy="0">중복 방지</tspan></text><path d="M 200 377 L 240 377" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 420 377 L 460 377" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 640 377 L 680 377" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 860 377 L 900 377" fill="none" stroke="#222222" stroke-width="3"  marker-end="url(#arrow)"/><text x="25" y="485" fill="#444444" font-size="24" font-weight="400"><tspan x="25" dy="0">사용자가 확정한 작업·대상·내용을 검사해 중복 없이 반영한다.</tspan></text><text x="25" y="545" fill="#333333" font-size="24" font-weight="400"><tspan x="25" dy="0">공개 분석은 근거와 함께, 개인 작업은 사용자 확인과 함께 완결한다.</tspan></text></g></svg>