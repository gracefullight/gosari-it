monorepo_root = true

[monorepo]
lockfile = true
config_roots = ["apps/*"]

[monorepo.task_defaults.build]
depends = ["^build"]

[settings]
experimental = true
lockfile = true

[hooks]
postinstall = '''
  mkdir -p .git/hooks

  # commit-msg
  cat > .git/hooks/commit-msg <<'EOF'
#!/bin/sh
exec mise run git:commit-msg -- "$1"
EOF
  chmod +x .git/hooks/commit-msg

  # pre-commit
  cat > .git/hooks/pre-commit <<'EOF'
#!/bin/sh
exec mise run git:pre-commit
EOF
  chmod +x .git/hooks/pre-commit

  # pre-push
  cat > .git/hooks/pre-push <<'EOF'
#!/bin/sh
exec mise run git:pre-push
EOF
  chmod +x .git/hooks/pre-push
'''

[tools]
node = "26"
python = "3.14"
bun = "latest"
uv = "latest"
hadolint = "latest"
hk = "2.7.0"

[tasks]
"db:migrate" = { depends = ["//apps/api:migrate"], description = "Run database migrations" }
"dev:web" = { depends = ["//apps/api:dev", "//apps/web:dev"], description = "Start API and Web services" }
dev = { depends = ["//apps/api:dev", "//apps/web:dev"], description = "Start all services" }
format = { depends = ["//apps/api:format", "//apps/web:format"], description = "Format all apps" }
"gen:openapi" = { depends = ["//apps/api:gen:openapi"], description = "Generate OpenAPI schema" }
"gen:api" = { depends = ["//apps/api:gen:openapi"], run = [{ tasks = ["//apps/web:gen:api"] }], description = "Generate OpenAPI schema and API clients" }
"infra:down" = { depends = ["//apps/api:infra:down"], description = "Stop local infrastructure" }
"infra:up" = { depends = ["//apps/api:infra:up"], description = "Start local infrastructure" }
install = { run = ["bun install", "uv sync --all-packages"], description = "Install workspace dependencies" }
lint = { depends = ["//apps/api:lint", "//apps/web:lint"], description = "Lint all apps" }
test = { depends = ["//apps/api:test", "//apps/web:test"], description = "Test all apps" }
typecheck = { depends = ["//apps/api:typecheck", "//apps/web:typecheck"], description = "Type check all apps" }

# SRS 실행환경 v1.2: mise + Docker Compose 원커맨드 시작·운영
[tasks.doctor]
description = "Check local Docker, locks, policy, ports and file permissions"
run = "node scripts/compose.mjs doctor"

[tasks.init]
description = "Create missing app .env files without overwrite"
run = "node scripts/compose.mjs init"

[tasks.up]
description = "Start the local Compose stack and verify readiness"
run = "node scripts/compose.mjs up"

[tasks.status]
description = "Show local services, schema and supported capabilities"
run = "node scripts/compose.mjs status"

[tasks.logs]
description = "Show recent redacted logs with bounded history"
run = "node scripts/compose.mjs logs"

[tasks.down]
description = "Drain and stop containers while keeping the public DB volume"
run = "node scripts/compose.mjs down"

[tasks.reset]
description = "Require an exact project confirmation before deleting public DB data"
run = "node scripts/compose.mjs reset"

[tasks."git:commit-msg"]
description = "Validate commit message using the lockfile commitlint"
run = "hk run commit-msg"

[tasks."git:pre-commit"]
description = "Lint apps touched by staged files"
run = "hk run pre-commit"

[tasks."git:pre-push"]
description = "Validate the branch name and run cached app test suites"
run = "bash scripts/pre-push.sh"
